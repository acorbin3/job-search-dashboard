<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Captured Answers — Learn Mode</title>
<link rel="stylesheet" href="/static/app.css">
  <style>

  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  .toolbar input { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 12px; font-size: 14px; width: 280px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); }
  td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:hover td { background: var(--panel); }
  .qkey { font-weight: 600; }
  .label { color: var(--muted); font-size: 12px; }
  .val { color: var(--success); }
  .ft { font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
  .cnt { color: var(--gold); font-variant-numeric: tabular-nums; }
  .variants { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .variants span { display: inline-block; margin-right: 10px; }
  .domains { font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body class="page">
<header>
  <div>
    <h1>Captured Answers</h1>
    <div class="meta" id="meta">loading…</div>
  </div>
  <div class="nav">
    {% for p in profiles %}
      <a href="/dashboard/{{ p.key }}">{{ p.short }}</a>
    {% endfor %}
    <a href="/applied">Applied</a>
  </div>
</header>

<div class="toolbar">
  <input id="q" type="search" placeholder="Filter by question or value…" />
</div>

<table>
  <thead>
    <tr>
      <th>Question</th>
      <th>Usual value</th>
      <th>Type</th>
      <th># times</th>
      <th>Seen on</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div class="empty" id="empty" style="display:none">
  No answers captured yet. Toggle Learn mode on in the capture extension, then fill out a job application.
</div>

<script>
let ALL = [];

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function usualValue(v) {
  // Pick the highest-count variant; fall back to the stored value.
  const entries = Object.entries(v.variants || {});
  if (!entries.length) return v.value || "";
  entries.sort((a, b) => b[1] - a[1]);
  return entries[0][0];
}

function variantsHtml(v) {
  const entries = Object.entries(v.variants || {}).sort((a, b) => b[1] - a[1]);
  if (entries.length <= 1) return "";
  return `<div class="variants">${entries.map(
    ([val, n]) => `<span>${escapeHtml(val)} <span class="cnt">×${n}</span></span>`
  ).join("")}</div>`;
}

function render(list) {
  const rows = document.getElementById("rows");
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  rows.innerHTML = list.map((v) => `
    <tr>
      <td>
        <div class="qkey">${escapeHtml(v.question_key)}</div>
        ${v.label && v.label.toLowerCase() !== v.question_key ? `<div class="label">${escapeHtml(v.label)}</div>` : ""}
      </td>
      <td>
        <div class="val">${escapeHtml(usualValue(v))}</div>
        ${variantsHtml(v)}
      </td>
      <td><span class="ft">${escapeHtml(v.field_type || "text")}</span></td>
      <td class="cnt">${v.seen_count}</td>
      <td class="domains">${(v.domains || []).map(escapeHtml).join(", ")}</td>
    </tr>
  `).join("");
}

function applyFilter() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  if (!q) return render(ALL);
  render(ALL.filter((v) =>
    v.question_key.includes(q) ||
    (v.label || "").toLowerCase().includes(q) ||
    usualValue(v).toLowerCase().includes(q)
  ));
}

(async function () {
  try {
    const resp = await fetch("/api/answers");
    const data = await resp.json();
    ALL = data.answers || [];
    document.getElementById("meta").textContent =
      `${ALL.length} distinct questions captured`;
    render(ALL);
  } catch (e) {
    document.getElementById("meta").textContent = "failed to load";
  }
  document.getElementById("q").addEventListener("input", applyFilter);
})();
</script>
</body>
</html>
